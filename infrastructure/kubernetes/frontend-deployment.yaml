apiVersion: apps/v1
kind: Deployment
metadata:
  name: proyecto-juegos-web
  namespace: proyecto-juegos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: proyecto-juegos-web
  template:
    metadata:
      labels:
        app: proyecto-juegos-web
    spec:
      containers:
        - name: web
          image: proyecto-juegos-web:latest
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
