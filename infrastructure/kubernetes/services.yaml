apiVersion: v1
kind: Service
metadata:
  name: proyecto-juegos-api
  namespace: proyecto-juegos
spec:
  selector:
    app: proyecto-juegos-api
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: proyecto-juegos-web
  namespace: proyecto-juegos
spec:
  selector:
    app: proyecto-juegos-web
  ports:
    - port: 80
      targetPort: 80
