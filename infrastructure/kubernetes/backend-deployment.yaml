apiVersion: apps/v1
kind: Deployment
metadata:
  name: proyecto-juegos-api
  namespace: proyecto-juegos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: proyecto-juegos-api
  template:
    metadata:
      labels:
        app: proyecto-juegos-api
    spec:
      containers:
        - name: api
          image: proyecto-juegos-api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: proyecto-juegos-config
            - secretRef:
                name: proyecto-juegos-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
