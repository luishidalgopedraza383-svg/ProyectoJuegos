apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: proyecto-juegos-api-hpa
  namespace: proyecto-juegos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: proyecto-juegos-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
