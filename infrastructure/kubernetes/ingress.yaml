apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proyecto-juegos-ingress
  namespace: proyecto-juegos
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: proyecto-juegos.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: proyecto-juegos-api
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proyecto-juegos-web
                port:
                  number: 80
