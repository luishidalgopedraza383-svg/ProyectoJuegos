# Plantilla SIN valores reales. No aplicar al cluster con secretos verdaderos.
apiVersion: v1
kind: Secret
metadata:
  name: proyecto-juegos-secrets
  namespace: proyecto-juegos
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@host:5432/proyecto_juegos"
  SUPABASE_JWT_SECRET: "replace-me"
  SUPABASE_SERVICE_ROLE_KEY: "replace-me"
