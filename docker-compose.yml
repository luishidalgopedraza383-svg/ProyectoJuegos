services:
  db:
    image: postgres:16-alpine
    container_name: proyecto_juegos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: proyecto_juegos
      POSTGRES_USER: proyecto_juegos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - proyecto_juegos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proyecto_juegos -d proyecto_juegos"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: proyecto-juegos-api
    restart: unless-stopped
    # .env es opcional: si existe, sus valores se usan salvo los que se
    # declaran abajo (que apuntan a los servicios internos de Docker).
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "4000"
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://proyecto_juegos:${DB_PASSWORD:-change_me}@db:5432/proyecto_juegos
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-proyecto-juegos-dev-secret-cambiar-en-produccion}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      UPLOAD_DIR: /app/uploads
    volumes:
      - proyecto_juegos_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000/api/v1}
        VITE_SHOW_DEMO_ACCOUNTS: ${VITE_SHOW_DEMO_ACCOUNTS:-false}
    container_name: proyecto-juegos-web
    restart: unless-stopped
    environment:
      # Debe coincidir con el origen de VITE_API_BASE_URL para la CSP del navegador.
      API_ORIGIN: ${API_ORIGIN:-http://localhost:4000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  proyecto_juegos_pgdata:
  proyecto_juegos_uploads:
